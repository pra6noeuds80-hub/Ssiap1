<script>
const COURS0=[
{t:"1. Le feu et son comportement",b:`<ul><li><b>Triangle du feu</b> : combustible + comburant (oxygène) + énergie d'activation. Supprimer un côté éteint le feu.</li><li><b>Classes de feu</b> : A solides (bois, papier) · B liquides · C gaz · D métaux · F huiles et graisses de cuisson.</li><li><b>Propagation</b> : conduction, convection, rayonnement, projection.</li><li><b>Fumées</b> : première cause de mortalité (asphyxie, toxicité, opacité). Phénomènes dangereux : embrasement généralisé éclair (flash-over), explosion de fumées (backdraft).</li><li><b>Modes d'extinction</b> : refroidissement (eau), étouffement (CO₂, mousse), inhibition (poudre), éloignement du combustible.</li></ul>`},
{t:"2. Sécurité incendie dans les bâtiments",b:`<ul><li><b>ERP</b> (établissements recevant du public) classés par <b>types</b> (activité : J, L, M, N, O, P, R, S, T, U, V, W, X, Y…) et par <b>catégories</b> (effectif) : 1re &gt; 1 500 pers. · 2e 701–1 500 · 3e 301–700 · 4e ≤ 300 · 5e sous le seuil.</li><li><b>IGH</b> : immeubles de grande hauteur (plus de 50 m pour l'habitation, 28 m sinon).</li><li><b>Résistance au feu</b> : R (stabilité), E (étanchéité aux flammes et gaz), I (isolation thermique). Ex. : CF 1 h.</li><li><b>Réaction au feu</b> : aptitude des matériaux à alimenter le feu (classes M0 à M4, Euroclasses A1 à F).</li><li><b>Compartimentage</b> : limite la propagation (parois, portes coupe-feu, clapets).</li><li><b>Désenfumage</b> : évacue fumées et chaleur, naturel ou mécanique.</li></ul>`},
{t:"3. Évacuation et moyens de secours",b:`<ul><li><b>Dégagements</b> : portes, circulations, escaliers, issues de secours ; toujours libres et déverrouillables.</li><li><b>Éclairage de sécurité</b> et signalisation des issues.</li><li><b>Unité de passage</b> (UP) = 0,60 m.</li><li><b>Moyens d'extinction</b> : extincteurs (eau pulvérisée, CO₂, poudre, mousse), RIA (robinets d'incendie armés), colonnes sèches/humides, poteaux et bouches d'incendie.</li><li><b>Extincteur</b> : on l'utilise dos au vent, à la base des flammes, par balayage.</li><li>Le <b>CO₂</b> convient aux feux électriques et liquides ; jamais d'eau en jet sur un feu électrique ou de friture.</li></ul>`},
{t:"4. Le SSI (système de sécurité incendie)",b:`<ul><li>Composé du <b>SDI</b> (détection incendie : détecteurs, déclencheurs manuels, centrale) et du <b>MSI</b> (mise en sécurité : fermeture de portes, désenfumage, arrêt de ventilation, report d'alarme).</li><li><b>Catégories A à E</b> : A est la plus complète, E la plus simple.</li><li><b>Alarme</b> : générale (évacuation) ou sélective. Le <b>PC sécurité</b> centralise l'exploitation.</li><li>Détecteurs : fumée (optique, ionique), chaleur (thermostatique, thermovélocimétrique), flammes.</li><li><b>Levée de doute</b> : vérifier sur place si l'alarme est réelle avant de déclencher la suite.</li></ul>`},
{t:"5. Rôle et missions de l'agent SSIAP 1",b:`<ul><li><b>Prévention</b> : accueil et information du public, surveillance des conditions de sécurité, repérage des anomalies.</li><li><b>Rondes</b> et contrôles : issues dégagées, extincteurs en place, éclairage de sécurité, portes coupe-feu fermées.</li><li><b>Entretien</b> : vérifier le registre de sécurité, signaler les défauts.</li><li><b>Intervention</b> : levée de doute, attaque d'un feu naissant, évacuation, accueil et guidage des secours.</li><li><b>Tenue</b> : main courante (rapport d'activité) tenue à jour.</li><li><b>Cadre légal</b> : carte professionnelle et diplôme SSIAP 1 ; formation initiale de 67 h, recyclage tous les 3 ans (avec SST à jour).</li></ul>`},
{t:"6. Alerte et accueil des secours",b:`<ul><li><b>Appels</b> : 18 (pompiers) ou 112 (numéro européen). SAMU 15, police 17.</li><li><b>Message d'alerte</b> : qui je suis, où (adresse exacte, bâtiment, étage), quoi (nature du sinistre), combien de victimes, accès et risques particuliers. On raccroche en dernier, après le régulateur.</li><li><b>Accueil des secours</b> : guider, donner plan et clés, informer sur personnes manquantes et risques.</li><li><b>Chaîne d'alerte</b> : agent → PC sécurité → responsable → secours.</li></ul>`},
{t:"7. Assistance à personnes et secourisme",b:`<ul><li>Assister les personnes : accueil, orientation, aide aux personnes à mobilité réduite ou handicapées lors d'une évacuation.</li><li><b>Protéger, alerter, secourir</b>. Sécuriser la zone avant d'agir.</li><li>Victime inconsciente qui respire : <b>PLS</b>. Qui ne respire pas : massage cardiaque et <b>défibrillateur (DAE)</b>.</li><li>Hémorragie : compression directe. Brûlure : refroidir à l'eau tempérée 10 min.</li><li>Sous-estimation : un <b>SST</b> valide est obligatoire.</li></ul>`},
{t:"8. Évacuation, consignes et habilitations",b:`<ul><li>Évacuer dans le calme, jamais par l'ascenseur, vers le point de rassemblement.</li><li>Fermer (sans verrouiller) les portes derrière soi pour ralentir le feu.</li><li>Dans la fumée : rester près du sol, se couvrir le visage.</li><li><b>Consignes de sécurité</b> affichées, plans d'évacuation, exercices réguliers.</li><li><b>Habilitation électrique</b> et <b>permis de feu</b> pour travaux par points chauds.</li></ul>`}
];
const Q0=[
["Quels sont les trois éléments du triangle du feu ?",["Combustible, comburant, énergie d'activation","Eau, air, chaleur","Gaz, bois, étincelle"],0,"Supprimer l'un des trois éteint le feu."],
["Un feu de liquides inflammables (essence) relève de la classe :",["A","B","D"],1,"A solides, B liquides, C gaz, D métaux, F huiles de cuisson."],
["Quelle classe correspond aux feux d'huiles de friture ?",["B","C","F"],2,"La classe F concerne les graisses et huiles de cuisson."],
["Quel mode de propagation se fait sans contact par ondes de chaleur ?",["Conduction","Rayonnement","Convection"],1,"Le rayonnement transmet la chaleur à distance."],
["Première cause de mortalité lors d'un incendie :",["Les brûlures","Les fumées","L'effondrement"],1,"Asphyxie et toxicité des fumées."],
["Quel agent extincteur convient aux feux d'origine électrique ?",["Eau en jet plein","CO₂","Mousse"],1,"Le CO₂ n'est pas conducteur."],
["On dirige le jet d'un extincteur :",["Vers le haut des flammes","À la base des flammes","Dans la fumée"],1,"Attaque à la base, dos au vent."],
["Les catégories d'ERP dépendent :",["De la surface","De l'effectif du public","Du nombre d'étages"],1,"Cinq catégories selon l'effectif."],
["Un ERP de 4e catégorie accueille :",["Plus de 1 500 personnes","301 à 700 personnes","Moins de 300 personnes (sous le seuil de la 5e)"],2,"4e : 300 personnes ou moins, au-dessus du seuil de la 5e."],
["Dans « CF 1 h », la lettre R signifie :",["Rayonnement","Résistance mécanique (stabilité)","Réaction"],1,"R stabilité, E étanchéité, I isolation."],
["Une unité de passage (UP) mesure :",["0,60 m","0,90 m","1,40 m"],0,"1 UP = 0,60 m."],
["Quelle catégorie de SSI est la plus complète ?",["A","C","E"],0,"A est la plus complète, E la plus simple."],
["Le SSI se compose :",["Du SDI et du MSI","Du RIA et de l'extincteur","Du PC et de la ronde"],0,"Système de détection + mise en sécurité."],
["Que fait-on en premier à la réception d'une alarme ?",["On évacue tout le monde sans vérifier","Une levée de doute","On éteint la centrale"],1,"Vérifier sur place la réalité du sinistre."],
["Numéro d'appel européen d'urgence :",["15","112","17"],1,"Le 18 reste le numéro des pompiers."],
["Dans le message d'alerte, on indique notamment :",["Uniquement le nom","Lieu précis, nature du sinistre, nombre de victimes","Seulement l'étage"],1,"Qui, où, quoi, combien, accès."],
["Victime inconsciente qui respire :",["On la met en PLS","On lui donne à boire","On la laisse sur le dos"],0,"Position latérale de sécurité."],
["Pour évacuer, on utilise :",["L'ascenseur","Les escaliers","Le monte-charge"],1,"Jamais l'ascenseur lors d'un incendie."],
["Durée de la formation initiale SSIAP 1 :",["21 h","67 h","140 h"],1,"67 heures ; recyclage tous les 3 ans."],
["Le document où sont consignés les contrôles de sécurité est :",["Le registre de sécurité","Le cahier de recettes","Le plan masse"],0,"Registre de sécurité tenu à disposition des commissions."]
];
let cur={};
function tab(n){for(let i=1;i<5;i++)document.getElementById('t'+i).className=i==n?'on':'';[home,quiz,exam,hard][n-1]()}
const $=s=>document.getElementById('app');
function home(){$().innerHTML=COURS.map((c,i)=>`<button class="m" onclick="mod(${i})">${c.t}</button>`).join('')}
function mod(i){const c=COURS[i];$().innerHTML=`<div class="card"><h3>${c.t}</h3>${c.b}</div><button class="pri" onclick="home()">← Retour</button> <button class="pri" onclick="tab(2)">QCM</button>`;scrollTo(0,0)}
function start(list){cur={l:list,i:0,s:0,a:false,w:[]};show()}
function quiz(){$().innerHTML=`<div class="card"><h3>QCM d'entraînement</h3><p>${Q.length} questions, correction immédiate.</p><button class="pri" onclick="start(shuf(Q.slice()))">Commencer</button></div>`}
function exam(){$().innerHTML=`<div class="card"><h3>Examen blanc</h3><p>20 questions tirées au hasard, 4 choix. Réussite à partir de 14/20.</p><button class="pri" onclick="start(shuf(Q.slice()).slice(0,20))">Lancer</button></div>`}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(){const{l,i}=cur;if(i>=l.length){const p=cur.s;$().innerHTML=`<div class="card"><h3>Résultat : ${p}/${l.length}</h3><p>${p/l.length>=.7?"Bravo, objectif atteint ✅":"Reprenez les cours puis réessayez 💪"}</p>${cur.w.length?'<h3>À revoir</h3>':''}${cur.w.map(q=>`<div class="exp"><b>${q[0]}</b><br>✔ ${q[1][q[2]]}<br>${q[3]}</div>`).join('')}<button class="pri" onclick="start(shuf(Q.slice()).slice(0,${l.length}))">Recommencer</button></div>`;return}
const q=l[i];cur.a=false;$().innerHTML=`<div class="bar"><i style="width:${i/l.length*100}%"></i></div><p class="mut">Question ${i+1}/${l.length}</p><div class="card"><b>${q[0]}</b></div>`+q[1].map((o,k)=>`<button class="opt" onclick="ans(${k},this)">${o}</button>`).join('')+`<div id="fb"></div>`}
function ans(k,el){if(cur.a)return;cur.a=true;const q=cur.l[cur.i],bs=document.querySelectorAll('.opt');if(k==q[2])cur.s++;else cur.w.push(q);bs[q[2]].classList.add('ok');if(k!=q[2])el.classList.add('ko');document.getElementById('fb').innerHTML=`<div class="exp">${q[3]}</div><button class="pri" onclick="cur.i++;show()">Suivant →</button>`}
const COURS=[
{t:"1. Chimie du feu et phases d'un incendie",b:`<ul><li><b>Tétraèdre du feu</b> : combustible, comburant, énergie d'activation + <b>réaction en chaîne</b>. L'inhibition (poudre, halons) agit sur la réaction en chaîne.</li><li><b>Grandeurs clés</b> : <b>point d'éclair</b> (température minimale où les vapeurs s'enflamment au contact d'une source), <b>point d'auto-inflammation</b> (sans source), <b>LIE/LSE</b> (limites inférieure et supérieure d'explosivité : plage de concentration gaz/air où l'inflammation est possible), pouvoir calorifique.</li><li><b>Phases</b> : naissance (feu localisé, intervention possible) → croissance → <b>embrasement généralisé éclair (flash-over)</b> : inflammation simultanée des gaz de pyrolyse et des matériaux, vers 500–600 °C en partie haute → feu pleinement développé → décroissance.</li><li><b>Explosion de fumées (backdraft)</b> : feu sous-ventilé riche en gaz imbrûlés ; un appel d'air brutal (ouverture de porte) provoque une explosion. Signes : fumées jaunâtres qui pulsent, vitres noircies, porte chaude.</li><li><b>Fumées</b> : CO (asphyxiant, inodore), HCN (cyanure, issu de plastiques/mousses), HCl ; opacité, chaleur et toxicité.</li><li><b>Classes</b> : A solides · B liquides · C gaz · D métaux · F huiles de cuisson. Modes de propagation : conduction, convection, rayonnement, projection.</li></ul>`},
{t:"2. Réaction et résistance au feu",b:`<ul><li><b>Réaction au feu</b> : contribution d'un matériau à l'incendie. Anciennes classes M0–M4 ; <b>Euroclasses</b> A1, A2, B, C, D, E, F, complétées par <b>s1–s3</b> (production de fumées) et <b>d0–d2</b> (gouttelettes enflammées). Ex. : B-s1,d0.</li><li><b>Résistance au feu</b> (éléments de construction) : <b>R</b> stabilité (capacité portante), <b>E</b> étanchéité aux flammes et gaz chauds, <b>I</b> isolation thermique.</li><li><b>SF</b> (stable au feu) = R · <b>PF</b> (pare-flammes) = R + E · <b>CF</b> (coupe-feu) = R + E + I. Durées : ¼ h, ½ h, ¾ h, 1 h, 1 h 30, 2 h…</li><li><b>Compartimentage</b> : parois et planchers CF, portes CF à fermeture automatique, clapets coupe-feu dans les gaines, recoupement des trémies.</li><li><b>Propagation</b> : par l'intérieur (circulations, gaines, escaliers non encloisonnés) et par la façade (règles de « C + D » entre baies de niveaux superposés).</li></ul>`},
{t:"3. Réglementation : ERP, IGH, Code du travail",b:`<ul><li><b>ERP</b> : règlement de sécurité du <b>25 juin 1980</b> (dispositions générales, articles <b>GE</b>, <b>MS</b> moyens de secours, <b>EL</b> éclairage, <b>CO</b> construction, <b>DF</b> désenfumage, <b>AM</b> aménagements, <b>PE</b> dispositions particulières…).</li><li><b>Types</b> : J accueil personnes âgées/handicapées · L salles d'audition, conférence, spectacle · M magasins, centres commerciaux · N restaurants, débits de boissons · O hôtels · P salles de danse/jeux · R enseignement, crèches · S bibliothèques · T expositions · U sanitaire · V cultes · W administrations, banques, bureaux · X sportifs couverts · Y musées. Types spéciaux : PA plein air, CTS chapiteaux, SG structures gonflables, PS parkings, GA gares, OA hôtels-restaurants d'altitude, EF établissements flottants, REF refuges.</li><li><b>Catégories</b> (effectif total public + personnel) : 1re &gt; 1 500 · 2e 701–1 500 · 3e 301–700 · 4e ≤ 300 (hors 5e) · 5e sous les seuils propres à chaque type (petit établissement, 1 seul groupe).</li><li><b>Commission de sécurité</b> : avis favorable/défavorable à l'ouverture et visites périodiques (périodicité selon catégorie). Le <b>registre de sécurité</b> est tenu par l'exploitant.</li><li><b>IGH</b> (arrêté du 30 décembre 2011) : plancher bas du dernier niveau &gt; 50 m (habitation) ou &gt; 28 m (autres). Classes GHA, GHO, GHR, GHS, GHU, GHW1 (50–200 m), GHW2 (&gt; 200 m), ITGH. Habitation : 4 familles (arrêté du 31 janvier 1986). Travail : Code du travail (R4227-…).</li></ul>`},
{t:"4. Dégagements et évacuation",b:`<ul><li><b>Unité de passage (UP)</b> = 0,60 m. Largeurs minimales : <b>1 UP = 0,90 m · 2 UP = 1,40 m · 3 UP = 1,80 m · 4 UP = 2,40 m</b>… au-delà 0,60 m par UP.</li><li><b>Nombre de sorties</b> : 1 jusqu'à 50 personnes · 2 de 51 à 500 · 3 de 501 à 1 500, puis une de plus par tranche supplémentaire.</li><li><b>Escaliers</b> : encloisonnés (parois CF, portes pare-flammes) ou à l'air libre ; mains courantes, marches non glissantes ; jamais d'ascenseur pour évacuer.</li><li><b>Désenfumage</b> : <b>naturel</b> (exutoires, ouvrants) ou <b>mécanique</b> (ventilateurs 400 °C/2 h) ; objectifs : maintenir les cheminements praticables, limiter l'élévation de température et faciliter l'action des secours.</li><li><b>Éclairage de sécurité</b> : évacuation et ambiance (antipanique), autonomie 1 h, BAES (blocs autonomes).</li><li><b>Alarme sonore</b> : signal d'évacuation, diffusion dans tout le bâtiment selon le type d'équipement d'alarme.</li><li><b>PMR</b> : <b>espace d'attente sécurisé (EAS)</b> à proximité des escaliers pour attendre les secours quand l'évacuation n'est pas possible ; guidage et prise en charge par l'agent.</li></ul>`},
{t:"5. Le SSI : composants et logique",b:`<ul><li><b>SSI</b> (norme NF S 61-931 et suivantes) = <b>SDI</b> (détection : détecteurs automatiques, déclencheurs manuels, <b>ECS</b> centrale de contrôle et signalisation) + <b>SMSI</b> (mise en sécurité : <b>CMSI</b> centralisateur, <b>UGA</b> unité de gestion d'alarme, <b>DAS</b> dispositifs actionnés de sécurité, <b>DCM</b> commandes manuelles).</li><li><b>Catégories A à E</b> : A = la plus complète (détection automatique généralisée, mise en sécurité automatique) ; E = la plus simple (déclencheurs manuels, alarme).</li><li><b>Équipements d'alarme</b> types 1 à 4 : type 1 le plus complet, type 4 le plus simple ; alarme générale ou restreinte.</li><li><b>Procédure</b> : détection → alarme restreinte → <b>T1 temps d'acquittement</b> (≤ 5 min) → <b>T2 levée de doute</b> (≤ 5 min) → alarme générale et mise en sécurité (DAS, désenfumage, ascenseurs au niveau de référence).</li><li><b>Détecteurs</b> : optiques de fumée, thermostatiques, thermovélocimétriques, de flammes (UV/IR), linéaires. Les fausses alarmes viennent de la poussière, vapeurs, travaux : toujours <b>lever le doute</b>.</li><li>Exploitation au <b>PC sécurité</b> : acquittement, gestion des pannes, main courante, consignes particulières.</li></ul>`},
{t:"6. Moyens de secours et d'extinction",b:`<ul><li><b>Extincteurs portatifs</b> (≤ 20 kg) : eau pulvérisée + additif, CO₂, poudre ABC/BC, mousse. En ERP (MS 38) : un appareil à eau pulvérisée de 6 L pour 200 m² et par niveau, au minimum un par niveau, près des accès.</li><li><b>Extincteurs mobiles</b> (chariots) pour risques importants. Vérification annuelle ; marque NF.</li><li><b>RIA</b> (robinets d'incendie armés, DN 19/6 ou 19/12), <b>colonnes sèches</b> (alimentées par les pompiers) et <b>humides</b> (en charge, IGH et bâtiments élevés), <b>poteaux/bouches d'incendie</b> : 60 m³/h sous 1 bar de pression résiduelle.</li><li><b>Choix de l'agent</b> : A eau/poudre ABC · B mousse, poudre, CO₂ · C couper le gaz d'abord · D poudre spéciale (jamais d'eau) · F extincteur à additif spécial cuisine ; <b>électrique</b> : CO₂ ou poudre, jamais d'eau en jet plein.</li><li><b>Utilisation</b> : dos au vent, jet à la base des flammes en balayage, retraite assurée, extincteur à 2 pour un feu significatif ; <b>CO₂</b> : risque de brûlure par le froid, danger en espace clos.</li><li><b>Sprinkleurs</b> (extinction automatique à eau) et brouillard d'eau pour risques particuliers.</li></ul>`},
{t:"7. Missions de l'agent SSIAP 1 et cadre d'emploi",b:`<ul><li><b>Arrêté du 2 mai 2005</b> : missions, emploi et qualification du personnel permanent des services de sécurité incendie des ERP et IGH.</li><li><b>Missions</b> : sensibilisation des occupants à la prévention ; entretien élémentaire des matériels de sécurité ; <b>rondes</b> de sécurité et surveillance des travaux (permis de feu) ; alerte et accueil des secours ; évacuation du public ; assistance à personnes ; exploitation du PC sécurité (en équipe).</li><li><b>Hiérarchie</b> : agent SSIAP 1 → chef d'équipe SSIAP 2 → chef de service SSIAP 3 (sous l'autorité du responsable unique de sécurité).</li><li><b>Prérequis et maintien</b> : diplôme SSIAP 1 (formation initiale 67 h), <b>SST/PSC1 à jour</b>, aptitude médicale, <b>recyclage tous les 3 ans (21 h)</b>.</li><li><b>Documents</b> : <b>registre de sécurité</b> (contrôles, vérifications, formation du personnel), <b>main courante</b> (événements du poste), consignes générales et particulières, plans d'intervention.</li><li><b>Rondes</b> : issues dégagées, DAS et portes CF, éclairage de sécurité, extincteurs en place et plombés, locaux à risques fermés, anomalies signalées.</li></ul>`},
{t:"8. Doctrine d'intervention et d'alerte",b:`<ul><li><b>Alarme → levée de doute</b> : l'agent se rend sur place avec radio et extincteur, constate, rend compte au PC. Si sinistre confirmé : <b>alerte des secours</b> (18 ou 112), déclenchement de l'alarme générale, évacuation.</li><li><b>Attaque d'un feu naissant</b> : en binôme si possible, avec l'extincteur adapté, sans s'exposer ; <b>ne pas s'engager</b> si la fumée gêne ou si la sortie n'est pas assurée.</li><li><b>Message d'alerte</b> : identité, adresse précise, nature du sinistre, nombre de victimes, accès, risques particuliers ; <b>on raccroche quand le centre de secours y invite</b>.</li><li><b>Accueil des secours</b> : guidage, plans, clés, état des mises en sécurité, personnes manquantes, risques (gaz, produits dangereux).</li><li><b>Évacuation</b> : ordre clair, fermeture des portes sans les verrouiller, pointage au point de rassemblement, balayage final des locaux.</li><li><b>Comptes rendus</b> : main courante, fiche d'intervention, retour d'expérience.</li></ul>`},
{t:"9. Secourisme et assistance à personnes",b:`<ul><li><b>Protéger – Alerter – Secourir</b> ; examen : conscience, respiration, hémorragie.</li><li><b>Arrêt cardiaque</b> : 30 compressions thoraciques (100–120/min, 5–6 cm) puis 2 insufflations ; <b>DAE</b> dès que disponible, électrodes posées, suivre les instructions vocales.</li><li><b>Inconscient qui respire</b> : PLS. <b>Hémorragie</b> : compression directe, pansement compressif. <b>Étouffement complet</b> : 5 claques dans le dos puis 5 compressions abdominales (Heimlich).</li><li><b>Brûlures</b> : eau tempérée 10 min, ne pas retirer ce qui adhère. <b>Intoxication par fumées</b> : sortir la victime à l'air libre, oxygène si formé.</li><li><b>Assistance</b> : accueil, orientation, aide aux personnes en situation de handicap, gestion du stress de la foule et des comportements de panique.</li></ul>`}
];
